name: Refresh chat asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update chat cache key
        shell: bash
        run: |
          set -e
          if ! grep -q 'chat-v2.js?v=4c22716af751ae53e64090cd03a439edebab6642' index.html; then
            echo 'Chat asset already refreshed; nothing to do.'
            exit 0
          fi
          sed -i 's#chat-v2.js?v=4c22716af751ae53e64090cd03a439edebab6642#chat-v2.js?v=hn-v3-20260915#g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force fresh chat asset'
          git push