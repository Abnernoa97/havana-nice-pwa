name: Apply lightweight chat visual style
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  patch:
    if: contains(github.event.issue.title, 'HN CHAT VISUAL PATCH')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat-v1.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chat-v1.js')
          s=p.read_text()
          old='''      .hn-chat-module{position:relative!important;background:linear-gradient(145deg,#0a1b12,#07100b)!important;border-color:rgba(130,190,145,.55)!important;box-shadow:0 10px 28px rgba(0,0,0,.22)}.hn-chat-module:hover{background:linear-gradient(145deg,#0d2418,#09150e)!important;border-color:rgba(160,215,170,.72)!important}'''
          new='''      .hn-chat-module{position:relative!important;background:#0b1b12!important;border-color:rgba(229,189,98,.38)!important;box-shadow:none!important}.hn-chat-module:hover{background:#0f2418!important;border-color:rgba(229,189,98,.58)!important}'''
          if old not in s: raise SystemExit('module style target not found')
          s=s.replace(old,new,1)
          old='''      .hn-chat-bubble{max-width:min(88%,560px);padding:10px 12px 8px;border:1px solid rgba(229,189,98,.32);background:#171717!important;backdrop-filter:blur(7px);cursor:pointer;touch-action:pan-y;user-select:none}.hn-chat-row.mine .hn-chat-bubble{border-color:#e5bd62!important;background:#0d5a3d!important;box-shadow:inset 0 0 0 1px rgba(255,241,168,.1),0 4px 18px rgba(0,0,0,.2)}'''
          new='''      .hn-chat-bubble{max-width:min(88%,560px);padding:10px 12px 8px;border:1px solid rgba(229,189,98,.28);background:#151a17!important;cursor:pointer;touch-action:pan-y;user-select:none}.hn-chat-row.mine .hn-chat-bubble{border-color:#e5bd62!important;background:#123f2d!important;box-shadow:none!important}'''
          if old not in s: raise SystemExit('bubble style target not found')
          s=s.replace(old,new,1)
          s=s.replace('''backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)''','''-webkit-backdrop-filter:none''',1)
          p.write_text(s)
          PY
      - name: Commit visual change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-v1.js
          git commit -m "Refine chat visual style"
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/chat-visual-lightweight.yml
          git commit -m "Remove temporary chat visual workflow"
          git push
