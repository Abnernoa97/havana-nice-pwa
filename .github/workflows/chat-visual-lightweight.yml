name: Apply lightweight chat visual style
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  patch:
    if: contains(github.event.issue.title, 'HN CHAT VISUAL PATCH')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat-v1.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chat-v1.js')
          s = p.read_text()
          replacements = [
            ('background:linear-gradient(145deg,#0a1b12,#07100b)', 'background:#0b1b12'),
            ('border-color:rgba(130,190,145,.55)', 'border-color:rgba(229,189,98,.38)'),
            ('box-shadow:0 10px 28px rgba(0,0,0,.22)', 'box-shadow:none'),
            ('background:linear-gradient(145deg,#0d2418,#09150e)', 'background:#0f2418'),
            ('border-color:rgba(160,215,170,.72)', 'border-color:rgba(229,189,98,.58)'),
            ('backdrop-filter:blur(7px);', ''),
            ('background:#0d5a3d', 'background:#123f2d'),
            ('box-shadow:inset 0 0 0 1px rgba(255,241,168,.1),0 4px 18px rgba(0,0,0,.2)', 'box-shadow:none'),
            ('backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)', '-webkit-backdrop-filter:none'),
          ]
          changed = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed += 1
          if changed == 0:
              raise SystemExit('No visual targets found; refusing to commit')
          p.write_text(s)
          print(f'Applied {changed} visual replacements')
          PY
      - name: Commit visual change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-v1.js
          git diff --cached --check
          git commit -m "Refine chat visual style"
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/chat-visual-lightweight.yml
          git commit -m "Remove temporary chat visual workflow"
          git push
