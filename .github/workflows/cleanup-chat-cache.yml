name: Clean chat cache and stale index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Refresh chat asset versions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh chat asset URLs and clean duplicate comments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./chat-v1.js?v=2d7e6b0de5bb4fd461d83d36c174090e66319864','./chat-v1.js?v=4c22716af751ae53e64090cd03a439edebab6642')
          s=s.replace('./chat-theme-v1.js?v=2d7e6b0de5bb4fd461d83d36c174090e66319864','./chat-theme-v1.js?v=6b20382062efef3afcbc8084a6fd2853a3534f89')
          bridge='  // Bridge the existing Supabase client to the isolated musician realtime clients.\n'
          s=re.sub(r'(?:\s*// Bridge the existing Supabase client to the isolated musician realtime clients\.\n){2,}', '\n'+bridge, s)
          notif='  // Bridge the existing Supabase client to the isolated notifications client.\n'
          s=re.sub(r'(?:\s*// Bridge the existing Supabase client to the isolated notifications client\.\n){2,}', '\n'+notif, s)
          p.write_text(s)
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Refresh chat asset versions'
          git push
