name: Fix chat home color
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-chat-home-color.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat module visual style
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chat-v1.js')
          s=p.read_text()
          old='.hn-chat-module{position:relative}'
          new='.hn-chat-module{position:relative!important;background:linear-gradient(145deg,#0a1b12,#07100b)!important;border-color:rgba(130,190,145,.55)!important;box-shadow:0 10px 28px rgba(0,0,0,.22)}.hn-chat-module:hover{background:linear-gradient(145deg,#0d2418,#09150e)!important;border-color:rgba(160,215,170,.72)!important}'
          if old not in s:
              raise SystemExit('target style not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chat-v1.js
          git diff --cached --quiet || git commit -m 'Apply green Chat de Información module style'
          git push