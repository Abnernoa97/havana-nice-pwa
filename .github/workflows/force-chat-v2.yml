name: Force chat asset v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fresh chat asset and switch index
        shell: bash
        run: |
          set -euo pipefail
          cp chat-v1.js chat-v2.js
          sed -i 's#./chat-v1.js?v=[^\"'"'"']*#./chat-v2.js?v=hn-v2#' index.html
          sed -i 's#./chat-theme-v1.js?v=[^\"'"'"']*#./chat-theme-v1.js?v=6b20382062efef3afcbc8084a6fd2853a3534f89#' index.html
          sed -i 's#hn-v16#hn-v17#g' sw.js
          if ! grep -q '/chat-v2.js' sw.js; then
            sed -i "s#'/chat-v1.js'#'/chat-v1.js','/chat-v2.js'#g" sw.js || true
          fi
          rm -f chat-v1.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js chat-v1.js chat-v2.js
          git commit -m 'Force fresh chat asset v2' || exit 0
          git push
