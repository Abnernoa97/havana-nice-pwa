name: Force chat asset v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-chat-v2.yml'
      - 'index.html'
      - 'sw.js'
      - 'chat-v1.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Force fresh chat asset v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fresh chat asset and switch index
        shell: bash
        run: |
          set -euo pipefail
          cp chat-v1.js chat-v2.js
          sed -i 's#./chat-v1.js?v=[^\"'"'"']*#./chat-v2.js?v=hn-v2#' index.html
          sed -i 's#hn-v16#hn-v17#g' sw.js
          rm -f chat-v1.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js chat-v1.js chat-v2.js
          git commit -m 'Force fresh chat asset v2' || exit 0
          git push
