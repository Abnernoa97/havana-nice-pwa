name: HN temporary label update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-label:
    if: github.event.head_commit.message == 'chore: prepare family label update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Músicos label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''          data-module="MÚSICOS"'''
          new = '''          data-module="FAMILIA HAVANA NICE"'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one data-module occurrence, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '''              Músicos'''
          new2 = '''              Familia Havana Nice'''
          if s.count(old2) != 1:
              raise SystemExit(f'Expected one visible label occurrence, found {s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit label-only change and remove temporary workflow
        run: |
          rm -f .github/workflows/hn-label-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/hn-label-update.yml
          git commit -m "feat: rename musicians module to family Havana Nice"
          git push