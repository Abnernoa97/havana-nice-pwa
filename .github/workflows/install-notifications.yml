name: Install musician notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with latest main before generating bridge
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Inject PWA, realtime bridges and app modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, os
          sha=os.environ.get('GITHUB_SHA','4')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<link[^>]+rel=["\']manifest["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'\s*<script>\s*if\s*\(\s*["\']serviceWorker["\']\s+in\s+navigator\s*\)[\s\S]*?</script>','',s,flags=re.I)
          s=s.replace('</head>','  <link rel="manifest" href="./manifest.json" />\n</head>',1)
          pwa='''<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => console.warn("HAVANA NICE service worker registration failed:", error)); }); }</script>'''
          s=s.replace('</body>',pwa+'</body>',1)
          for pattern in [r'\s*<script(?: type="module")? src="\./notifications-v(?:2|3|4)\.js(?:\?v=[^"\']+)?"></script>',r'\s*<script src="\./repertoire-v1\.js(?:\?v=[^"\']+)?"></script>',r'\s*<script src="\./calendar-v1\.js(?:\?v=[^"\']+)?"></script>',r'\s*<script src="\./family-v1\.js(?:\?v=[^"\']+)?"></script>',r'\s*<script src="\./operations-v1\.js(?:\?v=[^"\']+)?"></script>',r'\s*<script src="\./operations-fix\.js(?:\?v=[^"\']+)?"></script>']:
            s=re.sub(pattern,'',s)
          s=re.sub(r'^\s*window\.hnSupabase\s*=\s*supabase;\s*$','',s,flags=re.M)
          marker='  restoreSession();'
          bridge='  restoreSession();\n\n  window.hnSupabase = supabase;'
          if marker not in s: raise SystemExit('Could not find restoreSession() marker')
          s=s.replace(marker,bridge,1)
          tags=f'<script src="./notifications-v4.js?v={sha}"></script>\n<script src="./repertoire-v1.js?v={sha}"></script>\n<script src="./calendar-v1.js?v={sha}"></script>\n<script src="./family-v1.js?v={sha}"></script>\n<script src="./operations-v1.js?v={sha}"></script>\n<script src="./operations-fix.js?v={sha}"></script>\n'
          s=s.replace('</body>',tags+'</body>',1);p.write_text(s,encoding='utf-8')

          a=Path('admin.html'); h=a.read_text(encoding='utf-8')
          h=re.sub(r'\s*<script src="\./calendar-v1\.js(?:\?v=[^"\']+)?"></script>','',h)
          h=h.replace('</body>',f'<script src="./calendar-v1.js?v={sha}"></script>\n<script src="./notifications-admin-fix.js?v={sha}"></script>\n</body>',1)
          a.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          if git diff --cached --quiet; then echo "No generated changes to commit."; exit 0; fi
          git commit -m "fix: repair app module injection"
          git push origin HEAD:main
