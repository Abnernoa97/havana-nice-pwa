name: Install musician notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main before generating bridge
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Inject PWA, realtime bridges and multi-image notifications
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          # ---------- index.html ----------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'\s*<link[^>]+rel=["\']manifest["\'][^>]*>', '', s, flags=re.I)
          s = re.sub(r'\s*<script>\s*if\s*\(\s*["\']serviceWorker["\']\s+in\s+navigator\s*\)[\s\S]*?</script>', '', s, flags=re.I)

          pwa_head = '  <link rel="manifest" href="./manifest.json" />\n'
          if '</head>' not in s:
              raise SystemExit('Could not find </head>; refusing to modify index.html')
          s = s.replace('</head>', pwa_head + '</head>', 1)

          pwa_registration = '''<script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => {
                console.warn("HAVANA NICE service worker registration failed:", error);
              });
            });
          }
          </script>
          '''
          s = s.replace('</body>', pwa_registration + '</body>', 1)

          s = re.sub(r'\s*<script(?: type="module")? src="\./notifications-v(?:2|3|4)\.js(?:\?v=[^"\']+)?"></script>', '', s)
          s = re.sub(r'\s*<script src="\./repertoire-v1\.js(?:\?v=[^"\']+)?"></script>', '', s)
          s = re.sub(r'^\s*window\.hnSupabase\s*=\s*supabase;\s*$', '', s, flags=re.M)

          marker = '  restoreSession();'
          bridge = '  restoreSession();\n\n  // Bridge the existing Supabase client to the isolated musician realtime clients.\n  window.hnSupabase = supabase;'
          if marker not in s:
              raise SystemExit('Could not find restoreSession() marker; refusing to modify index.html')
          s = s.replace(marker, bridge, 1)

          sha = os.environ.get('GITHUB_SHA', '4')
          tags = (
              f'<script src="./notifications-v4.js?v={sha}"></script>\n'
              f'<script src="./repertoire-v1.js?v={sha}"></script>\n'
          )
          s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s, encoding='utf-8')

          # ---------- admin.html: 1-3 notification images ----------
          a = Path('admin.html')
          h = a.read_text(encoding='utf-8')

          h = h.replace(
              'Adjuntar imagen (opcional)<br>JPG · PNG · WEBP · máximo 5 MB',
              'Adjuntar imágenes (opcional)<br>1 a 3 fotos · JPG · PNG · WEBP · máximo 5 MB por foto'
          )
          h = h.replace(
              '<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp">',
              '<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp" multiple>'
          )
          h = h.replace(
              '.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}',
              '.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}.image-preview-list{display:flex;flex-wrap:wrap;gap:10px}'
          )
          h = h.replace(
              'let musicians=[],notifications=[],songs=[],selectedImage=null;',
              'let musicians=[],notifications=[],songs=[],selectedImages=[];'
          )

          old_reset = "function resetImage(){selectedImage=null;$(\'nImage\').value=\'\';$(\'imagePreview\').removeAttribute(\'src\');$(\'imagePreviewWrap\').style.display=\'none\'}"
          new_reset = "function resetImage(){selectedImages=[];$(\'nImage\').value=\'\';$(\'imagePreviewWrap\').innerHTML=\'\';$(\'imagePreviewWrap\').style.display=\'none\'}"
          if old_reset in h:
              h = h.replace(old_reset, new_reset)

          old_change = "$(\'nImage\').onchange=()=>{const file=$(\'nImage\').files&&$(\'nImage\').files[0];if(!file){resetImage();return}if(![\'image/jpeg\',\'image/png\',\'image/webp\'].includes(file.type)||file.size>5*1024*1024){$(\'nMsg\').textContent=\'Imagen no válida: JPG, PNG o WEBP hasta 5 MB\';resetImage();return}selectedImage=file;$(\'imagePreview\').src=URL.createObjectURL(file);$(\'imagePreviewWrap\').style.display=\'flex\';$(\'nMsg\').textContent=\'\'};"
          new_change = "$(\'nImage\').onchange=()=>{const files=Array.from($(\'nImage\').files||[]);if(!files.length){resetImage();return}if(files.length>3){$(\'nMsg\').textContent=\'Máximo 3 fotos\';resetImage();return}if(files.some(file=>![\'image/jpeg\',\'image/png\',\'image/webp\'].includes(file.type)||file.size>5*1024*1024)){$(\'nMsg\').textContent=\'Cada foto debe ser JPG, PNG o WEBP hasta 5 MB\';resetImage();return}selectedImages=files;$(\'imagePreviewWrap\').innerHTML=\'<div id=\"imagePreviewList\" class=\"image-preview-list\"></div><button id=\"imageRemove\" class=\"image-remove danger\" type=\"button\">Quitar</button>\';files.forEach(file=>{const img=document.createElement(\'img\');img.className=\'image-preview\';img.alt=\'Vista previa\';img.src=URL.createObjectURL(file);$(\'imagePreviewList\').appendChild(img)});$(\'imagePreviewWrap\').style.display=\'flex\';$(\'imageRemove\').onclick=resetImage;$(\'nMsg\').textContent=\'\'};"
          if old_change in h:
              h = h.replace(old_change, new_change)

          old_publish = "try{let imageUrl=null;if(selectedImage){$(\'nMsg\').textContent=\'Subiendo imagen…\';imageUrl=await uploadNotificationImage(selectedImage)}$(\'nMsg\').textContent=\'Publicando…\';const{error}=await s.rpc(\'admin_create_notification_with_image\',{p_title:title,p_message:message,p_image_url:imageUrl});if(error)throw error;"
          new_publish = "try{let imageUrls=[];if(selectedImages.length){$(\'nMsg\').textContent=\'Subiendo imágenes…\';for(const file of selectedImages)imageUrls.push(await uploadNotificationImage(file))}$(\'nMsg\').textContent=\'Publicando…\';const{error}=await s.rpc(\'admin_create_notification_with_images\',{p_title:title,p_message:message,p_image_urls:imageUrls});if(error)throw error;"
          if old_publish in h:
              h = h.replace(old_publish, new_publish)

          old_render = "${n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:''}"
          new_render = "${(Array.isArray(n.image_urls)&&n.image_urls.length)?n.image_urls.slice(0,3).map(u=>`<img class=\"notification-image\" src=\"${esc(u)}\" alt=\"Imagen de notificación\">`).join(''):(n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:'' )}"
          if old_render in h:
              h = h.replace(old_render, new_render)

          a.write_text(h, encoding='utf-8')

          # ---------- notifications-v4.js: render up to 3 images ----------
          q = Path('notifications-v4.js')
          n = q.read_text(encoding='utf-8')
          n = n.replace(
              "select('id,title,message,image_url,created_at')",
              "select('id,title,message,image_url,image_urls,created_at')"
          )
          old_img = "if(item.image_url){var image=makeElement('img','hn-n-image');image.src=String(item.image_url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)}"
          new_img = "var imageUrls=Array.isArray(item.image_urls)?item.image_urls:(item.image_url?[item.image_url]:[]);imageUrls.slice(0,3).forEach(function(url){if(!url)return;var image=makeElement('img','hn-n-image');image.src=String(url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)})"
          if old_img in n:
              n = n.replace(old_img, new_img)
          q.write_text(n, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html notifications-v4.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: update app notification image support"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict on attempt $attempt; syncing with latest main and regenerating..."
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          import re
          import os

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<link[^>]+rel=["\']manifest["\'][^>]*>', '', s, flags=re.I)
          s = re.sub(r'\s*<script>\s*if\s*\(\s*["\']serviceWorker["\']\s+in\s+navigator\s*\)[\s\S]*?</script>', '', s, flags=re.I)
          s = s.replace('</head>', '  <link rel="manifest" href="./manifest.json" />\n</head>', 1)
          pwa_registration = '''<script>
          if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
              navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => {
                console.warn("HAVANA NICE service worker registration failed:", error);
              });
            });
          }
          </script>
          '''
          s = s.replace('</body>', pwa_registration + '</body>', 1)
          s = re.sub(r'\s*<script(?: type="module")? src="\./notifications-v(?:2|3|4)\.js(?:\?v=[^"\']+)?"></script>', '', s)
          s = re.sub(r'\s*<script src="\./repertoire-v1\.js(?:\?v=[^"\']+)?"></script>', '', s)
          s = re.sub(r'^\s*window\.hnSupabase\s*=\s*supabase;\s*$', '', s, flags=re.M)
          marker = '  restoreSession();'
          bridge = '  restoreSession();\n\n  // Bridge the existing Supabase client to the isolated musician realtime clients.\n  window.hnSupabase = supabase;'
          if marker not in s:
              raise SystemExit('Could not find restoreSession() marker during retry')
          s = s.replace(marker, bridge, 1)
          sha = os.environ.get('GITHUB_SHA', '4')
          tags = f'<script src="./notifications-v4.js?v={sha}"></script>\n<script src="./repertoire-v1.js?v={sha}"></script>\n'
          s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s, encoding='utf-8')

          a = Path('admin.html')
          h = a.read_text(encoding='utf-8')
          h = h.replace('Adjuntar imagen (opcional)<br>JPG · PNG · WEBP · máximo 5 MB','Adjuntar imágenes (opcional)<br>1 a 3 fotos · JPG · PNG · WEBP · máximo 5 MB por foto')
          h = h.replace('<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp">','<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp" multiple>')
          h = h.replace('.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}','.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}.image-preview-list{display:flex;flex-wrap:wrap;gap:10px}')
          h = h.replace('let musicians=[],notifications=[],songs=[],selectedImage=null;','let musicians=[],notifications=[],songs=[],selectedImages=[];')
          old_reset = "function resetImage(){selectedImage=null;$(\'nImage\').value=\'\';$(\'imagePreview\').removeAttribute(\'src\');$(\'imagePreviewWrap\').style.display=\'none\'}"
          new_reset = "function resetImage(){selectedImages=[];$(\'nImage\').value=\'\';$(\'imagePreviewWrap\').innerHTML=\'\';$(\'imagePreviewWrap\').style.display=\'none\'}"
          h = h.replace(old_reset, new_reset)
          old_change = "$(\'nImage\').onchange=()=>{const file=$(\'nImage\').files&&$(\'nImage\').files[0];if(!file){resetImage();return}if(![\'image/jpeg\',\'image/png\',\'image/webp\'].includes(file.type)||file.size>5*1024*1024){$(\'nMsg\').textContent=\'Imagen no válida: JPG, PNG o WEBP hasta 5 MB\';resetImage();return}selectedImage=file;$(\'imagePreview\').src=URL.createObjectURL(file);$(\'imagePreviewWrap\').style.display=\'flex\';$(\'nMsg\').textContent=\'\'};"
          new_change = "$(\'nImage\').onchange=()=>{const files=Array.from($(\'nImage\').files||[]);if(!files.length){resetImage();return}if(files.length>3){$(\'nMsg\').textContent=\'Máximo 3 fotos\';resetImage();return}if(files.some(file=>![\'image/jpeg\',\'image/png\',\'image/webp\'].includes(file.type)||file.size>5*1024*1024)){$(\'nMsg\').textContent=\'Cada foto debe ser JPG, PNG o WEBP hasta 5 MB\';resetImage();return}selectedImages=files;$(\'imagePreviewWrap\').innerHTML=\'<div id=\"imagePreviewList\" class=\"image-preview-list\"></div><button id=\"imageRemove\" class=\"image-remove danger\" type=\"button\">Quitar</button>\';files.forEach(file=>{const img=document.createElement(\'img\');img.className=\'image-preview\';img.alt=\'Vista previa\';img.src=URL.createObjectURL(file);$(\'imagePreviewList\').appendChild(img)});$(\'imagePreviewWrap\').style.display=\'flex\';$(\'imageRemove\').onclick=resetImage;$(\'nMsg\').textContent=\'\'};"
          h = h.replace(old_change, new_change)
          old_publish = "try{let imageUrl=null;if(selectedImage){$(\'nMsg\').textContent=\'Subiendo imagen…\';imageUrl=await uploadNotificationImage(selectedImage)}$(\'nMsg\').textContent=\'Publicando…\';const{error}=await s.rpc(\'admin_create_notification_with_image\',{p_title:title,p_message:message,p_image_url:imageUrl});if(error)throw error;"
          new_publish = "try{let imageUrls=[];if(selectedImages.length){$(\'nMsg\').textContent=\'Subiendo imágenes…\';for(const file of selectedImages)imageUrls.push(await uploadNotificationImage(file))}$(\'nMsg\').textContent=\'Publicando…\';const{error}=await s.rpc(\'admin_create_notification_with_images\',{p_title:title,p_message:message,p_image_urls:imageUrls});if(error)throw error;"
          h = h.replace(old_publish, new_publish)
          old_render = "${n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:''}"
          new_render = "${(Array.isArray(n.image_urls)&&n.image_urls.length)?n.image_urls.slice(0,3).map(u=>`<img class=\"notification-image\" src=\"${esc(u)}\" alt=\"Imagen de notificación\">`).join(''):(n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:'' )}"
          h = h.replace(old_render, new_render)
          a.write_text(h, encoding='utf-8')

          q = Path('notifications-v4.js')
          n = q.read_text(encoding='utf-8')
          n = n.replace("select('id,title,message,image_url,created_at')", "select('id,title,message,image_url,image_urls,created_at')")
          old_img = "if(item.image_url){var image=makeElement('img','hn-n-image');image.src=String(item.image_url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)}"
          new_img = "var imageUrls=Array.isArray(item.image_urls)?item.image_urls:(item.image_url?[item.image_url]:[]);imageUrls.slice(0,3).forEach(function(url){if(!url)return;var image=makeElement('img','hn-n-image');image.src=String(url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)})"
          n = n.replace(old_img, new_img)
          q.write_text(n, encoding='utf-8')
          PY
            git add index.html admin.html notifications-v4.js
            git commit -m "fix: update musician realtime bridges" || true
          done
          echo "Could not publish generated app updates after 3 attempts."
          exit 1
