name: One-time chat cache cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh chat asset URL and remove obsolete theme loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./chat-v2.js?v=hn-v2', './chat-v2.js?v=4c22716af751ae53e64090cd03a439edebab6642')
          s = '\n'.join(line for line in s.splitlines() if 'chat-theme-v1.js' not in line) + '\n'
          p.write_text(s, encoding='utf-8')
          PY
          grep -q './chat-v2.js?v=4c22716af751ae53e64090cd03a439edebab6642' index.html
          ! grep -q 'chat-theme-v1.js' index.html

      - name: Remove this temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-chat-cache-fix.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-chat-cache-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Clean chat cache and remove obsolete theme loader'
          git push