name: Repair index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair index') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index from known-good commit and set generic title
        run: |
          git checkout 296b18b4ca4437d1c4e7ce4f6e431dd2d3de6131 -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>HAVANA NICE — ORLY SHOW</title>', '<title>HAVANA NICE</title>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair index and set generic HAVANA NICE title'
          git push origin HEAD:main
