name: Revert last chat visual layer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/revert-chat-visual.yml'
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visual layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          lines = [line for line in s.splitlines() if 'chat-visual-v1.js' not in line]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('chat-visual-v1.js').unlink(missing_ok=True)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Revert last chat visual layer'
          git rm .github/workflows/revert-chat-visual.yml
          git commit -m 'Remove temporary chat visual revert workflow'
          git push
