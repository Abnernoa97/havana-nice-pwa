name: Temporary chat video controls patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Chat video: remove three-dot options') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chat video controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('chat-v1.js')
          s = p.read_text()
          old = '<video controls preload="metadata" src="${esc(url)}"></video>'
          new = '<video controls controlsList="nodownload noplaybackrate nofullscreen noremoteplayback" disablePictureInPicture preload="metadata" src="${esc(url)}"></video>'
          if old not in s:
              raise SystemExit('Expected video markup not found; aborting without changes.')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-v1.js
          git rm .github/workflows/temp-chat-video-controls.yml
          git commit -m "Chat video: remove three-dot options"
          git push
