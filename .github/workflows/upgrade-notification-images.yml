name: Upgrade notification images to 1-3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade notification image support
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text()
          s = s.replace('Adjuntar imagen (opcional)<br>JPG · PNG · WEBP · máximo 5 MB', 'Adjuntar imágenes (opcional)<br>1 a 3 fotos · JPG · PNG · WEBP · máximo 5 MB por foto')
          s = s.replace('<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp">', '<input id="nImage" type="file" accept="image/jpeg,image/png,image/webp" multiple>')
          s = s.replace('.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}', '.image-preview{display:block;width:120px;height:80px;object-fit:cover;border:1px solid var(--gold)}.image-preview-list{display:flex;flex-wrap:wrap;gap:10px}')
          s = s.replace('let musicians=[],notifications=[],songs=[],selectedImage=null;', 'let musicians=[],notifications=[],songs=[],selectedImages=[];')
          s = s.replace('function resetImage(){selectedImage=null;$('"'"'nImage'"'"').value='"'"''"'"';$('"'"'imagePreview'"'"').removeAttribute('"'"'src'"'"');$('"'"'imagePreviewWrap'"'"').style.display='"'"'none'"'"'}', 'function resetImage(){selectedImages=[];$('"'"'nImage'"'"').value='"'"''"'"';$('"'"'imagePreview'"'"').removeAttribute('"'"'src'"'"');$('"'"'imagePreviewWrap'"'"').style.display='"'"'none'"'"'}')
          old = "$('nImage').onchange=()=>{const file=$('nImage').files&&$('nImage').files[0];if(!file){resetImage();return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){$('nMsg').textContent='Imagen no válida: JPG, PNG o WEBP hasta 5 MB';resetImage();return}selectedImage=file;$('imagePreview').src=URL.createObjectURL(file);$('imagePreviewWrap').style.display='flex';$('nMsg').textContent=''};"
          new = "$('nImage').onchange=()=>{const files=Array.from($('nImage').files||[]);if(!files.length){resetImage();return}if(files.length>3){$('nMsg').textContent='Máximo 3 fotos';resetImage();return}if(files.some(file=>!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)){$('nMsg').textContent='Cada foto debe ser JPG, PNG o WEBP hasta 5 MB';resetImage();return}selectedImages=files;$('imagePreviewWrap').innerHTML='<div id=\"imagePreviewList\" class=\"image-preview-list\"></div><button id=\"imageRemove\" class=\"image-remove danger\" type=\"button\">Quitar</button>';$('imagePreviewList').innerHTML='';files.forEach(file=>{const img=document.createElement('img');img.className='image-preview';img.alt='Vista previa';img.src=URL.createObjectURL(file);$('imagePreviewList').appendChild(img)});$('imagePreviewWrap').style.display='flex';$('imageRemove').onclick=resetImage;$('nMsg').textContent=''};"
          if old not in s: raise SystemExit('admin onchange block not found')
          s = s.replace(old, new)
          old2 = "try{let imageUrl=null;if(selectedImage){$('nMsg').textContent='Subiendo imagen…';imageUrl=await uploadNotificationImage(selectedImage)}$('nMsg').textContent='Publicando…';const{error}=await s.rpc('admin_create_notification_with_image',{p_title:title,p_message:message,p_image_url:imageUrl});if(error)throw error;"
          new2 = "try{let imageUrls=[];if(selectedImages.length){$('nMsg').textContent='Subiendo imágenes…';for(const file of selectedImages)imageUrls.push(await uploadNotificationImage(file))}$('nMsg').textContent='Publicando…';const{error}=await s.rpc('admin_create_notification_with_images',{p_title:title,p_message:message,p_image_urls:imageUrls});if(error)throw error;"
          if old2 not in s: raise SystemExit('admin publish block not found')
          s = s.replace(old2, new2)
          s = s.replace("${n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:''}", "${(Array.isArray(n.image_urls)&&n.image_urls.length)?n.image_urls.map(u=>`<img class=\"notification-image\" src=\"${esc(u)}\" alt=\"Imagen de notificación\">`).join(''):(n.image_url?`<img class=\"notification-image\" src=\"${esc(n.image_url)}\" alt=\"Imagen de notificación\">`:'' )}")
          p.write_text(s)

          q = Path('notifications-v4.js')
          n = q.read_text()
          n = n.replace("select('id,title,message,image_url,created_at')", "select('id,title,message,image_url,image_urls,created_at')")
          old_img = "if(item.image_url){var image=makeElement('img','hn-n-image');image.src=String(item.image_url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)}"
          new_img = "var imageUrls=Array.isArray(item.image_urls)?item.image_urls:(item.image_url?[item.image_url]:[]);imageUrls.slice(0,3).forEach(function(url){if(!url)return;var image=makeElement('img','hn-n-image');image.src=String(url);image.alt='Imagen de notificación';image.loading='lazy';image.decoding='async';article.appendChild(image)})"
          if old_img not in n: raise SystemExit('notification image render block not found')
          n = n.replace(old_img, new_img)
          q.write_text(n)

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html notifications-v4.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: support up to 3 notification images'
          git push
