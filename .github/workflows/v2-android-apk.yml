name: HAVANA NICE V2 Android APK

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - 'v2/apps/android/**'
      - 'v2/packages/shared/**'
      - 'v2/package.json'
      - 'v2/package-lock.json'
      - '.github/workflows/v2-android-apk.yml'
      - '.github/workflows/v2-apk-direct-download.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havana-nice-v2-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact dependencies
        working-directory: v2
        run: npm ci

      - name: Generate native Android project
        working-directory: v2/apps/android
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      # The installed APK must be a standalone app: debug builds require Metro.
      - name: Build standalone release APK with embedded JS bundle
        working-directory: v2/apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify JS bundle is packaged and APK is signed
        shell: bash
        run: |
          set -euo pipefail
          APK=v2/apps/android/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.havananice.v2'"
          sha256sum "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp v2/apps/android/android/app/build/outputs/apk/release/app-release.apk \
             HAVANA-NICE-V2-FOUNDATION-STANDALONE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAVANA-NICE-V2-FOUNDATION-STANDALONE-APK
          path: HAVANA-NICE-V2-FOUNDATION-STANDALONE.apk
          if-no-files-found: error
          retention-days: 30
