name: HAVANA NICE V2 direct Android APK distribution

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - '.github/workflows/v2-apk-direct-download.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-v2-native-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      APK_RUN_ID: '40208063556'
      EXPECTED_COMMIT: 'fdda88cb1c289aeb929add168c1e5300aa87e871'
      APK_ARTIFACT: 'HAVANA-NICE-V2-FOUNDATION-STANDALONE-APK'
      DEST_BRANCH: 'havana-nice-v2-apk-downloads'
      APK_NAME: 'HAVANA-NICE-V2-CHAT2-OFFLINE-QUEUE.apk'

    steps:
      - uses: actions/checkout@v5

      - name: Verify APK originated from successful fix build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            STATUS="$(gh run view "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
            if [ "$STATUS" = completed ]; then break; fi
            sleep 10
          done
          test "$STATUS" = completed
          CONCLUSION="$(gh run view "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          COMMIT="$(gh run view "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          test "$CONCLUSION" = success
          test "$COMMIT" = "$EXPECTED_COMMIT"

      - name: Fetch and verify independently built standalone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/havana-v2-apk
          gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$APK_ARTIFACT" --dir /tmp/havana-v2-apk
          mv /tmp/havana-v2-apk/HAVANA-NICE-V2-FOUNDATION-STANDALONE.apk "/tmp/havana-v2-apk/$APK_NAME"
          test "$(stat -c%s "/tmp/havana-v2-apk/$APK_NAME")" -gt 40000000
          unzip -Z1 "/tmp/havana-v2-apk/$APK_NAME" | grep -Fxq 'assets/index.android.bundle'
          sha256sum "/tmp/havana-v2-apk/$APK_NAME"

      - name: Publish ONLY in dedicated V2 APK branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "havana-nice-v2-automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$DEST_BRANCH"
          git switch -C "$DEST_BRANCH" FETCH_HEAD
          cp "/tmp/havana-v2-apk/$APK_NAME" "$APK_NAME"
          sha256sum "$APK_NAME" >> SHA256SUMS.txt
          git add "$APK_NAME" SHA256SUMS.txt
          git commit -m "Publish isolated Android Chat 2 offline queue and delivery states"
          git -c http.postBuffer=524288000 push origin "HEAD:refs/heads/$DEST_BRANCH"

      - name: Confirm stable direct APK link responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEST_BRANCH/$APK_NAME"
          for attempt in $(seq 1 10); do
            STATUS="$(curl -L -s -o /dev/null -w '%{http_code}' -I "$URL")"
            if [ "$STATUS" = 200 ]; then
              echo "DIRECT_APK_URL=$URL"
              exit 0
            fi
            sleep 5
          done
          echo "Direct APK URL did not return HTTP 200" >&2
          exit 1
