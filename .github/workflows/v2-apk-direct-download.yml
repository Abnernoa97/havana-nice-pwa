name: HAVANA NICE V2 direct Android APK distribution

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - '.github/workflows/v2-apk-direct-download.yml'
      - '.github/workflows/v2-android-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: havana-nice-v2-direct-apk-publish
  cancel-in-progress: false

jobs:
  publish-v2-priority-one:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: havana-nice-v2-foundation
      DEST_BRANCH: havana-nice-v2-apk-downloads
      APK_ARTIFACT: HAVANA-NICE-V2-FOUNDATION-STANDALONE-APK
      APK_NAME: HAVANA-NICE-V2-CHAT-PRIORITY-1-20261025.apk

    steps:
      - uses: actions/checkout@v5

      - name: Find successful standalone APK built from this exact commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          RUN_ID=""
          for attempt in $(seq 1 100); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v2-android-apk.yml --branch "$SOURCE_BRANCH" --commit "$SHA" --limit 20 --json databaseId,status,conclusion,headSha --jq '[.[] | select(.headSha == "'"$SHA"'" and .status == "completed" and .conclusion == "success")][0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            FAILED="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v2-android-apk.yml --branch "$SOURCE_BRANCH" --commit "$SHA" --limit 20 --json status,conclusion,headSha --jq '[.[] | select(.headSha == "'"$SHA"'" and .status == "completed" and .conclusion == "failure")] | length')"
            if [ "$FAILED" != "0" ]; then
              echo "Android build failed for commit $SHA" >&2
              exit 1
            fi
            sleep 10
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Verified successful Android build $RUN_ID for $SHA"

      - name: Download and verify standalone release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/havana-v2-apk
          gh run download "${{ steps.build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "$APK_ARTIFACT" --dir /tmp/havana-v2-apk
          mv /tmp/havana-v2-apk/HAVANA-NICE-V2-FOUNDATION-STANDALONE.apk "/tmp/havana-v2-apk/$APK_NAME"
          test "$(stat -c%s "/tmp/havana-v2-apk/$APK_NAME")" -gt 40000000
          unzip -Z1 "/tmp/havana-v2-apk/$APK_NAME" | grep -Fxq 'assets/index.android.bundle'
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          sha256sum "/tmp/havana-v2-apk/$APK_NAME" | tee /tmp/havana-v2-apk/SHA256SUMS.txt

      - name: Publish only to dedicated V2 APK downloads branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "havana-nice-v2-automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$DEST_BRANCH"
          git switch -C "$DEST_BRANCH" FETCH_HEAD
          cp "/tmp/havana-v2-apk/$APK_NAME" "$APK_NAME"
          cat /tmp/havana-v2-apk/SHA256SUMS.txt >> SHA256SUMS.txt
          git add "$APK_NAME" SHA256SUMS.txt
          git commit -m "Publish verified Chat Priority 1 APK for $GITHUB_SHA"
          git -c http.postBuffer=524288000 push origin "HEAD:refs/heads/$DEST_BRANCH"

      - name: Verify direct download URL returns HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEST_BRANCH/$APK_NAME"
          for attempt in $(seq 1 10); do
            STATUS="$(curl -L -s -o /dev/null -w '%{http_code}' -I "$URL")"
            if [ "$STATUS" = 200 ]; then
              echo "DIRECT_APK_URL=$URL"
              exit 0
            fi
            sleep 5
          done
          echo "Direct APK URL did not return HTTP 200" >&2
          exit 1
