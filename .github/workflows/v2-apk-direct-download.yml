name: HAVANA NICE V2 direct Android APK distribution

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - 'v2/apps/android/**'
      - 'v2/packages/shared/**'
      - 'v2/package-lock.json'
      - '.github/workflows/v2-android-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Match the release build's 'latest commit wins' policy. An older build can be
# cancelled by a newer source push; do not leave its distribution job polling for
# 16 minutes and reporting a false release failure after the newer APK succeeds.
concurrency:
  group: havana-nice-v2-direct-apk-publish
  cancel-in-progress: true

jobs:
  publish-verified-v2-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BRANCH: havana-nice-v2-foundation
      DEST_BRANCH: havana-nice-v2-apk-downloads
      APK_ARTIFACT: HAVANA-NICE-V2-FOUNDATION-STANDALONE-APK

    steps:
      - uses: actions/checkout@v5

      - name: Find successful Android APK from this exact source commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "$SOURCE_BRANCH"
          RUN_ID=""
          for attempt in $(seq 1 95); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v2-android-apk.yml \
              --branch "$SOURCE_BRANCH" --commit "$SHA" --limit 15 \
              --json databaseId,status,conclusion,headSha \
              --jq '[.[] | select(.headSha == "'"${SHA}"'" and .status == "completed" and .conclusion == "success")][0].databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            FAILED="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow v2-android-apk.yml \
              --branch "$SOURCE_BRANCH" --commit "$SHA" --limit 15 \
              --json status,conclusion,headSha \
              --jq '[.[] | select(.headSha == "'"${SHA}"'" and .status == "completed" and .conclusion == "failure")] | length')"
            if [ "$FAILED" != 0 ]; then
              echo "Android release build failed for this commit" >&2
              exit 1
            fi
            sleep 10
          done
          test -n "$RUN_ID"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$SHA"
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=HAVANA-NICE-V2-ANDROID-${SHA:0:12}.apk" >> "$GITHUB_ENV"

      - name: Download and verify signed standalone APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/havana-v2-apk
          gh run download "${{ steps.build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "$APK_ARTIFACT" --dir /tmp/havana-v2-apk
          mv /tmp/havana-v2-apk/HAVANA-NICE-V2-FOUNDATION-STANDALONE.apk "/tmp/havana-v2-apk/$APK_NAME"
          test "$(stat -c%s "/tmp/havana-v2-apk/$APK_NAME")" -gt 40000000
          unzip -Z1 "/tmp/havana-v2-apk/$APK_NAME" | grep -Fxq 'assets/index.android.bundle'
          SDK_BUILD_TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$SDK_BUILD_TOOLS/apksigner" verify "/tmp/havana-v2-apk/$APK_NAME"

          # H01: verify compatibility with the *last published V2 APK* before release.
          git fetch origin "$DEST_BRANCH"
          PREVIOUS_RECORD="$(git show FETCH_HEAD:SHA256SUMS.txt | grep -E '^[0-9a-f]{64}  HAVANA-NICE-V2-ANDROID-[0-9a-f]{12}\.apk$' | tail -n 1)"
          test -n "$PREVIOUS_RECORD"
          read -r PREVIOUS_SHA PREVIOUS_NAME <<< "$PREVIOUS_RECORD"
          [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREVIOUS_NAME" =~ ^HAVANA-NICE-V2-ANDROID-[0-9a-f]{12}\.apk$ ]]
          PREVIOUS_APK=/tmp/havana-v2-apk/previous-installed.apk
          git show "FETCH_HEAD:$PREVIOUS_NAME" > "$PREVIOUS_APK"
          echo "$PREVIOUS_SHA  $PREVIOUS_APK" | sha256sum -c -
          "$SDK_BUILD_TOOLS/apksigner" verify "$PREVIOUS_APK"

          signature_sha256() {
            "$SDK_BUILD_TOOLS/apksigner" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          previous_signer="$(signature_sha256 "$PREVIOUS_APK")"
          current_signer="$(signature_sha256 "/tmp/havana-v2-apk/$APK_NAME")"
          test -n "$previous_signer"
          test "$current_signer" = "$previous_signer"

          version_code() {
            "$SDK_BUILD_TOOLS/aapt" dump badging "$1" |
              sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n 1
          }
          previous_code="$(version_code "$PREVIOUS_APK")"
          current_code="$(version_code "/tmp/havana-v2-apk/$APK_NAME")"
          [[ "$previous_code" =~ ^[0-9]+$ ]]
          [[ "$current_code" =~ ^[0-9]+$ ]]
          test "$current_code" -gt "$previous_code"
          "$SDK_BUILD_TOOLS/aapt" dump badging "/tmp/havana-v2-apk/$APK_NAME" |
            grep -F "package: name='com.havananice.v2'" > /dev/null
          echo "H01 upgrade guard PASS: certificate preserved, package unchanged, versionCode $previous_code -> $current_code"
          (cd /tmp/havana-v2-apk && sha256sum "$APK_NAME") | tee /tmp/havana-v2-apk/SHA256SUMS.txt

      - name: Publish ONLY in the dedicated V2 binary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "havana-nice-v2-automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "$DEST_BRANCH"
          git switch -C "$DEST_BRANCH" FETCH_HEAD
          cp "/tmp/havana-v2-apk/$APK_NAME" "$APK_NAME"
          cat /tmp/havana-v2-apk/SHA256SUMS.txt >> SHA256SUMS.txt
          git add "$APK_NAME" SHA256SUMS.txt
          git commit -m "Publish verified V2 Android APK built from $GITHUB_SHA"
          git -c http.postBuffer=524288000 push origin "HEAD:refs/heads/$DEST_BRANCH"

      - name: Verify direct Android download responds HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEST_BRANCH/$APK_NAME"
          for attempt in $(seq 1 12); do
            HTTP="$(curl -L -s -o /dev/null -w '%{http_code}' -I "$URL")"
            if [ "$HTTP" = 200 ]; then
              echo "DIRECT_APK_URL=$URL"
              exit 0
            fi
            sleep 5
          done
          echo "Direct APK URL failed availability check" >&2
          exit 1
