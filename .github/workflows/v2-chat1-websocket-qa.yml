name: HAVANA NICE V2 Chat 1 WebSocket smoke test

on:
  push:
    branches: [havana-nice-v2-foundation]
    paths:
      - '.github/workflows/v2-chat1-websocket-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websocket-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Live dual-client upgrade, broadcast and persisted history
        env:
          QA_TOKEN_A: DdlObkKnFOoJnhgrQxMTZectb1jO6_5G4neNvAAYME8
          QA_TOKEN_B: QOeLUfukCkUzSh5eI4SPxSuDWIqpikhkTV7fH7tEUg0
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const base='https://havana-nice-v2-dev.soloaplicaciones97.workers.dev';
          const url=base.replace('https://','wss://')+'/ws';
          const sockets = [];
          function connect(token) {
            return new Promise((resolve,reject)=>{
              let timer=setTimeout(()=>reject(new Error('WebSocket handshake timeout')),18000);
              const ws=new WebSocket(url,['havana-v2','session.'+token]);
              sockets.push(ws);
              ws.onopen=()=>{clearTimeout(timer); resolve(ws);};
              ws.onerror=e=>{clearTimeout(timer);reject(new Error('Upgrade failed: '+(e.message||'network error')));};
              ws.onclose=e=>{clearTimeout(timer);reject(new Error('Closed during handshake '+e.code+' '+e.reason));};
            });
          }
          const waitEvent=(ws,kind,match=()=>true)=>new Promise((resolve,reject)=>{
            const timer=setTimeout(()=>{ws.removeEventListener('message', listener);reject(new Error('Timeout waiting '+kind));},12000);
            const listener=e=>{try{const v=JSON.parse(e.data);if(v.type===kind&&match(v)){clearTimeout(timer);ws.removeEventListener('message',listener);resolve(v);}}catch{}};
            ws.addEventListener('message',listener);
          });
          (async()=>{
            const [a,b]=await Promise.all([connect(process.env.QA_TOKEN_A),connect(process.env.QA_TOKEN_B)]);
            console.log('Both WebSockets upgraded; negotiated',a.protocol||'(none)',b.protocol||'(none)');
            const id='smoketest_'+Date.now().toString(36);
            const recvA=waitEvent(a,'chat.message',x=>x.message?.clientMessageId===id);
            const recvB=waitEvent(b,'chat.message',x=>x.message?.clientMessageId===id);
            a.send(JSON.stringify({type:'chat.send',clientMessageId:id,text:'V2 Chat 1 automated WebSocket test'}));
            const [m1,m2]=await Promise.all([recvA,recvB]);
            assert.equal(m1.message.seq,m2.message.seq);
            const response=await fetch(base+'/api/chat/messages',{headers:{Authorization:'Bearer '+process.env.QA_TOKEN_A}});
            assert.equal(response.status,200);
            const hist=await response.json();
            assert.ok(hist.messages.some(m=>m.clientMessageId===id));
            console.log('PASS: dual-client realtime, persist D1, history with authenticated session');
            for(const w of sockets) w.close(1000,'QA finished');
          })().catch(e=>{console.error('FAIL:',e.message); for(const w of sockets)try{w.close()}catch{};process.exitCode=1});
          NODE
