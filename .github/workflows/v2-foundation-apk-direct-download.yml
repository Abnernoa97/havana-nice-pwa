name: HAVANA NICE V2 Foundation APK direct download

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - '.github/workflows/v2-foundation-apk-direct-download.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-lab-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '40068929315'
      ARTIFACT_NAME: HAVANA-NICE-V2-FOUNDATION-APK
      TAG: havana-nice-v2-foundation-lab-20261024
      EXPECTED_SHA256: 5433f123b31bccf4ae1965fd94eff5a35b2e81834deea57b351e077bb4ba3041
      APK_BUILD_COMMIT: fad95e2c46c8e44c0ce063d939525270525ae0b7
    steps:
      - name: Download previously verified Foundation APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir dist
          test -s dist/HAVANA-NICE-V2-FOUNDATION.apk

      - name: Verify exact APK checksum
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  dist/HAVANA-NICE-V2-FOUNDATION.apk" | sha256sum --check

      - name: Publish isolated V2 prerelease with direct APK asset
        shell: bash
        run: |
          set -euo pipefail
          NOTES="HAVANA NICE V2 Foundation — Android lab APK. This is a separate package (com.havananice.v2), not an update to production. Download the .apk file directly; physical Android/iPhone QA is pending."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/HAVANA-NICE-V2-FOUNDATION.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/HAVANA-NICE-V2-FOUNDATION.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$APK_BUILD_COMMIT" \
              --title "HAVANA NICE V2 Foundation — Android LAB" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url: .url, assets: [.assets[].url]}'
