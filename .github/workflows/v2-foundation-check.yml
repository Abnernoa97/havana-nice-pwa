name: HAVANA NICE V2 foundation check

on:
  push:
    branches:
      - havana-nice-v2-foundation
    paths:
      - 'v2/**'
      - '.github/workflows/v2-foundation-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: havana-nice-v2-foundation-check
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Validate V2 foundation structure
        run: node scripts/check-structure.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Verify zero-billing Drive adapter safety
        run: npm run test:media -w @havana/cloudflare

      - name: Build iPhone PWA
        run: npm run build:pwa

      - name: Export Android bundle
        run: npm run export -w @havana/android

      - name: Verify live Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            https://havana-nice-v2-dev.soloaplicaciones97.workers.dev/health \
            | tee /tmp/havana-health.json
          grep -q '"ok":true' /tmp/havana-health.json
          grep -q '"database":"ok"' /tmp/havana-health.json
          grep -q '"schemaVersion":"foundation-v1"' /tmp/havana-health.json

      - name: Verify live Durable Object
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            https://havana-nice-v2-dev.soloaplicaciones97.workers.dev/realtime/health \
            | tee /tmp/havana-realtime-health.json
          grep -q '"ok":true' /tmp/havana-realtime-health.json
          grep -q '"durableObject":"ChatRoom"' /tmp/havana-realtime-health.json

      - name: Verify CHAT 1 rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://havana-nice-v2-dev.soloaplicaciones97.workers.dev"
          STATUS=$(curl --silent --show-error -o /tmp/v2-chat-unauthorized.json -w '%{http_code}' "$BASE/api/chat/messages")
          test "$STATUS" = "401"
          grep -q 'error' /tmp/v2-chat-unauthorized.json
          STATUS=$(curl --silent --show-error -o /tmp/v2-chat-denied.json -w '%{http_code}' \
            -X POST "$BASE/api/chat/session" \
            -H 'Content-Type: application/json' \
            --data '{"displayName":"ci_unapproved_account"}')
          test "$STATUS" = "403"
          grep -q 'administrador' /tmp/v2-chat-denied.json
          STATUS=$(curl --silent --show-error -o /tmp/v2-chat-session-unauthorized.json -w '%{http_code}' "$BASE/api/chat/session")
          test "$STATUS" = "401"

      - name: Verify live private media endpoint is closed without independent Google OAuth
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://havana-nice-v2-dev.soloaplicaciones97.workers.dev"
          STATUS="$(curl --silent --show-error --output /tmp/hnv2-media-private.json --write-out '%{http_code}' "$BASE/api/chat/media/status")"
          test "$STATUS" = "401"
          grep -q 'Unauthorized' /tmp/hnv2-media-private.json
          STATUS="$(curl --silent --show-error --output /tmp/hnv2-media-upload.json --write-out '%{http_code}' \
            -X POST "$BASE/api/chat/media/upload" -H 'Content-Type: image/jpeg' \
            --data-binary 'not-a-photo')"
          test "$STATUS" = "401"
          curl --fail --silent --show-error "$BASE/health" | grep -q 'havana-cloud-private-bridge-pending'

      - name: Verify native Android WebSocket origin is permitted
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://havana-nice-v2-dev.soloaplicaciones97.workers.dev"
          OWN_ORIGIN="$BASE"
          HTTP="$(curl --silent --show-error --output /tmp/v2-native-ws.json --write-out '%{http_code}' \
            "$BASE/ws" -H "Origin: $OWN_ORIGIN" -H 'Authorization: Bearer fake-native-session')"
          test "$HTTP" = 401
          grep -q Unauthorized /tmp/v2-native-ws.json
          HTTP="$(curl --silent --show-error --output /tmp/v2-external-ws.json --write-out '%{http_code}' \
            "$BASE/ws" -H "Origin: https://untrusted.example")"
          test "$HTTP" = 403

      - name: Verify live iPhone PWA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            https://havana-nice-v2-dev.pages.dev/ \
            | tee /tmp/havana-pwa.html
          grep -q 'HAVANA NICE V2' /tmp/havana-pwa.html
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
            https://havana-nice-v2-dev.pages.dev/manifest.webmanifest \
            | tee /tmp/havana-manifest.json
          grep -q 'HAVANA NICE V2' /tmp/havana-manifest.json
