name: HAVANA NICE V2 one-time native video lock sync
on:
  push:
    branches: [havana-nice-v2-foundation]
    paths:
      - '.github/workflows/v2-media-deps-once.yml'
permissions:
  contents: write
jobs:
  lock-native-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: havana-nice-v2-foundation
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Add exact Expo 58 video playback dependency using npm resolver
        working-directory: v2
        run: npm install --workspace @havana/android --save-exact expo-video@58.0.12 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only real package manifests and lock, never Cloud
        shell: bash
        run: |
          set -euo pipefail
          node -e "let p=require('./v2/apps/android/package.json'); let l=require('./v2/package-lock.json'); if(p.dependencies['expo-video']!=='58.0.12'||l.packages['node_modules/expo-video']?.version!=='58.0.12') process.exit(1)"
          git add v2/apps/android/package.json v2/package-lock.json
          git diff --cached --check
          git config user.name "havana-v2-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps(v2 Android): add exact expo-video 58.0.12 with npm-resolved lock for inline playback"
          git push origin HEAD:havana-nice-v2-foundation
