name: HAVANA V2 one-time Android header WebSocket QA
on:
  push:
    branches: [havana-nice-v2-foundation]
    paths: ['.github/workflows/v2-native-ws-qa-once.yml']
permissions:
  contents: read
jobs:
  verify-native-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: v2
        run: npm ci
      - name: Test native Authorization handshake alongside browser PWA socket
        working-directory: v2
        env:
          QA_NATIVE: 1gA5tjyr66RZlLhZfLW04vi_C9rU49HoyymtOSl_Zdk
          QA_BROWSER: eKZwhPEnshh3lYJjwnrlWHabVKyUPhu4EC8ptv4z_fE
        run: |
          node <<'NODE'
          const WebSocket=require('ws');
          const assert=require('node:assert/strict');
          const base='https://havana-nice-v2-dev.soloaplicaciones97.workers.dev';
          const host=base.replace(/^https:/,'wss:')+'/ws';
          const sockets=[];
          const connect=(protocols,options={})=>new Promise((resolve,reject)=>{
            const ws=new WebSocket(host,protocols,options);
            sockets.push(ws);
            const timer=setTimeout(()=>reject(Error('WebSocket upgrade timed out')),12000);
            ws.once('open',()=>{clearTimeout(timer);resolve(ws);});
            ws.once('error',err=>{clearTimeout(timer);reject(err);});
          });
          const listen=(socket,id)=>new Promise((resolve,reject)=>{
            const timer=setTimeout(()=>reject(Error('Message not broadcast')),12000);
            function onmsg(raw) {
              let msg; try {msg=JSON.parse(raw.toString());}catch{return;}
              if(msg.type==='chat.message'&&msg.message?.clientMessageId===id) {
                clearTimeout(timer);socket.off('message',onmsg);resolve(msg.message);
              }
            }
            socket.on('message',onmsg);
          });
          (async()=>{
            const native=await connect(['havana-v2'],{headers:{Authorization:'Bearer '+process.env.QA_NATIVE}});
            const pwa=await connect(['havana-v2','session.'+process.env.QA_BROWSER]);
            assert.equal(native.protocol,'havana-v2');
            assert.equal(pwa.protocol,'havana-v2');
            const id='nativeqa_'+Date.now().toString(36);
            const receivedN=listen(native,id),receivedP=listen(pwa,id);
            native.send(JSON.stringify({type:'chat.send',clientMessageId:id,text:'Lab native authorization upgrade QA'}));
            const [a,b]=await Promise.all([receivedN,receivedP]);
            assert.equal(a.seq,b.seq);
            const response=await fetch(base+'/api/chat/messages',{headers:{Authorization:'Bearer '+process.env.QA_NATIVE}});
            assert.equal(response.status,200);
            const hist=await response.json();
            assert.ok(hist.messages.some(m=>m.clientMessageId===id));
            console.log('PASS native Authorization header handshake + PWA protocol + D1 persisted broadcast');
            sockets.forEach(s=>s.close());
          })().catch(e=>{console.error('FAIL',e.message);sockets.forEach(s=>{try{s.close()}catch{}});process.exitCode=1});
          NODE
