name: HAVANA NICE V2 SQLite dependency lock update
on:
  push:
    branches: [havana-nice-v2-foundation]
    paths: [.github/workflows/v2-sqlite-lock-once.yml]
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Add official Expo SQLite to isolated V2 workspace
        working-directory: v2
        run: |
          npm install -w @havana/android 'expo-sqlite@~58.0.14' --save --package-lock=true
          npm ci --ignore-scripts
      - name: Commit only V2 app manifest and reproducible lock
        run: |
          git config user.name "havana-nice-v2-automation"
          git config user.email "actions@users.noreply.github.com"
          git add v2/apps/android/package.json v2/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m "Add official Expo SQLite for durable V2 Android offline outbox"
          git push origin HEAD:havana-nice-v2-foundation
