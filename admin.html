<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVANA NICE — ADMIN</title><style>body{margin:0;background:#020302;color:#f4f1e8;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:42px 20px}.brand{text-align:center;font:32px Georgia,serif;letter-spacing:.16em;color:#fff1a8}.line{width:46px;height:1px;background:#e5bd62;margin:16px auto 30px}.card{border:1px solid #8c6424;padding:24px;background:#090a08;margin-bottom:16px}h1{font:34px Georgia,serif;color:#fff1a8;margin:0 0 8px}.sub{font-size:10px;letter-spacing:.2em;color:#aaa;text-transform:uppercase;margin-bottom:22px}input,textarea,button{border:1px solid #8c6424;background:#050605;color:#f4f1e8;padding:12px;box-sizing:border-box}input{width:100%;height:48px;margin:5px 0}textarea{width:100%;min-height:90px;resize:vertical;margin:5px 0;font-family:inherit}button{color:#fff1a8;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-size:10px}.row{display:flex;gap:8px}.row input{flex:1}.row button{width:110px}.list{margin-top:20px}.person,.notification{border-top:1px solid #333;padding:15px 0}.person{display:flex;justify-content:space-between;align-items:center}.notification{display:flex;justify-content:space-between;gap:15px}.name,.ntitle{text-transform:uppercase;letter-spacing:.1em}.status,.nmessage,.ndate{font-size:9px;color:#aaa;margin-top:6px;line-height:1.45}.actions{display:flex;gap:6px;flex-shrink:0}.hidden{display:none}.msg{font-size:9px;color:#aaa;min-height:18px;margin-top:10px;text-transform:uppercase;letter-spacing:.08em}.logout{width:100%;margin-top:8px}.section-gap{margin-top:28px}@media(max-width:520px){.person,.notification{align-items:flex-start}.actions{flex-direction:column}.actions button{min-width:100px}}</style></head><body><main class="wrap"><div class="brand">HAVANA NICE</div><div class="line"></div><section id="loginCard" class="card"><h1>Admin</h1><div class="sub">Acceso privado</div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" style="width:100%">Entrar</button><div id="loginMsg" class="msg"></div></section><div id="app" class="hidden"><section class="card"><h1>Músicos</h1><div class="sub">Administrar acceso</div><div class="row"><input id="newName" placeholder="Nombre del músico"><button id="add">Agregar</button></div><div id="msg" class="msg"></div><div id="list" class="list"></div></section><section class="card"><h1>Notificaciones</h1><div class="sub">Aparecen en la app del músico en tiempo real</div><input id="nTitle" placeholder="Título de la notificación"><textarea id="nMessage" placeholder="Mensaje"></textarea><button id="nAdd" style="width:100%;margin-top:6px">Publicar notificación</button><div id="nMsg" class="msg"></div><div id="nList" class="list"></div></section><button id="logout" class="logout">Cerrar sesión</button></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://xzfradccsxonmauinecl.supabase.co','sb_publishable_Ip5rGK0UVXIfOjs_RQ_LhA_c14foHN9');const $=x=>document.getElementById(x);async function check(){const{data:{session}}=await s.auth.getSession();if(!session){$('loginCard').classList.remove('hidden');$('app').classList.add('hidden');return}const{data}=await s.rpc('admin_is_admin');if(data!==true){await s.auth.signOut();return}$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');load();loadNotifications()}async function load(){const{data,error}=await s.rpc('admin_list_musicians');if(error){$('msg').textContent='Error al cargar';return}$('list').innerHTML='';for(const m of data){const e=document.createElement('div');e.className='person';e.innerHTML='<div><div class="name"></div><div class="status"></div></div><div class="actions"><button class="toggle"></button><button class="del">Eliminar</button></div>';$('list').appendChild(e);e.querySelector('.name').textContent=m.username;e.querySelector('.status').textContent=m.active?'ACTIVO':'DESACTIVADO';e.querySelector('.toggle').textContent=m.active?'Desactivar':'Activar';e.querySelector('.toggle').onclick=async()=>{await s.rpc('admin_set_musician_active',{p_id:m.id,p_active:!m.active});load()};e.querySelector('.del').onclick=async()=>{if(confirm('Eliminar '+m.username+'?')){await s.rpc('admin_delete_musician',{p_id:m.id});load()}}}}async function loadNotifications(){const{data,error}=await s.rpc('admin_list_notifications');if(error){$('nMsg').textContent='Error al cargar';return}renderNotifications(data||[])}function renderNotifications(data){$('nList').innerHTML='';for(const n of data){const e=document.createElement('div');e.className='notification';e.innerHTML='<div><div class="ntitle"></div><div class="nmessage"></div><div class="ndate"></div></div><div class="actions"><button class="ndel">Borrar</button></div>';$('nList').appendChild(e);e.querySelector('.ntitle').textContent=n.title;e.querySelector('.nmessage').textContent=n.message;e.querySelector('.ndate').textContent=new Date(n.created_at).toLocaleString();e.querySelector('.ndel').onclick=async()=>{const{error}=await s.rpc('admin_delete_notification',{p_id:n.id});if(error){$('nMsg').textContent='No se pudo borrar';return}loadNotifications()}}}$('login').onclick=async()=>{const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Acceso no autorizado';return}check()};$('add').onclick=async()=>{const name=$('newName').value.trim();if(!name)return;const{error}=await s.rpc('admin_create_musician',{p_username:name});if(error){$('msg').textContent='No se pudo agregar';return}$('newName').value='';load()};$('nAdd').onclick=async()=>{const title=$('nTitle').value.trim(),message=$('nMessage').value.trim();if(!title||!message){$('nMsg').textContent='Completa título y mensaje';return}const{error}=await s.rpc('admin_create_notification',{p_title:title,p_message:message});if(error){$('nMsg').textContent='No se pudo publicar';return}$('nTitle').value='';$('nMessage').value='';$('nMsg').textContent='Publicada';loadNotifications()};$('logout').onclick=async()=>{await s.auth.signOut();check()};check();</script></body></html>
