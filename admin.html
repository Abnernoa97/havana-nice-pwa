<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAVANA NICE — ADMIN</title><style>body{margin:0;background:#020302;color:#f4f1e8;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:48px 20px}.brand{text-align:center;font:32px Georgia,serif;letter-spacing:.16em;color:#fff1a8}.line{width:46px;height:1px;background:#e5bd62;margin:16px auto 34px}.card{border:1px solid #8c6424;padding:28px;background:#090a08}h1{font:42px Georgia,serif;color:#fff1a8;margin:0 0 8px}.sub{font-size:10px;letter-spacing:.2em;color:#aaa;text-transform:uppercase;margin-bottom:25px}input,button{height:48px;border:1px solid #8c6424;background:#050605;color:#f4f1e8;padding:0 14px;box-sizing:border-box}input{width:100%;text-align:center;margin:6px 0}button{color:#fff1a8;cursor:pointer;text-transform:uppercase;letter-spacing:.14em;font-size:10px}.row{display:flex;gap:8px}.row input{flex:1}.row button{width:110px}.list{margin-top:20px}.person{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #333;padding:14px 0}.name{text-transform:uppercase;letter-spacing:.1em}.status{font-size:8px;color:#aaa;margin-top:5px}.actions{display:flex;gap:6px}.hidden{display:none}.msg{font-size:9px;color:#aaa;min-height:18px;margin-top:10px;text-transform:uppercase;letter-spacing:.08em}.logout{width:100%;margin-top:25px}</style></head><body><main class="wrap"><div class="brand">HAVANA NICE</div><div class="line"></div><section id="loginCard" class="card"><h1>Admin</h1><div class="sub">Acceso privado</div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" style="width:100%">Entrar</button><div id="loginMsg" class="msg"></div></section><section id="app" class="card hidden"><h1>Músicos</h1><div class="sub">Administrar acceso</div><div class="row"><input id="newName" placeholder="Nombre del músico"><button id="add">Agregar</button></div><div id="msg" class="msg"></div><div id="list" class="list"></div><button id="logout" class="logout">Cerrar sesión</button></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://xzfradccsxonmauinecl.supabase.co','sb_publishable_Ip5rGK0UVXIfOjs_RQ_LhA_c14foHN9');const $=x=>document.getElementById(x);async function check(){const{data:{session}}=await s.auth.getSession();if(!session){$('loginCard').classList.remove('hidden');$('app').classList.add('hidden');return}const{data}=await s.rpc('admin_is_admin');if(data!==true){await s.auth.signOut();return}$('loginCard').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){const{data,error}=await s.rpc('admin_list_musicians');if(error){$('msg').textContent='Error al cargar';return}$('list').innerHTML='';for(const m of data){const e=document.createElement('div');e.className='person';e.innerHTML='<div><div class="name"></div><div class="status"></div></div><div class="actions"><button class="toggle"></button><button class="del">Eliminar</button></div>';$('list').appendChild(e);e.querySelector('.name').textContent=m.username;e.querySelector('.status').textContent=m.active?'ACTIVO':'DESACTIVADO';e.querySelector('.toggle').textContent=m.active?'Desactivar':'Activar';e.querySelector('.toggle').onclick=async()=>{await s.rpc('admin_set_musician_active',{p_id:m.id,p_active:!m.active});load()};e.querySelector('.del').onclick=async()=>{if(confirm('Eliminar '+m.username+'?')){await s.rpc('admin_delete_musician',{p_id:m.id});load()}}}}$('login').onclick=async()=>{const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Acceso no autorizado';return}check()};$('add').onclick=async()=>{const name=$('newName').value.trim();if(!name)return;const{error}=await s.rpc('admin_create_musician',{p_username:name});if(error){$('msg').textContent='No se pudo agregar';return}$('newName').value='';load()};$('logout').onclick=async()=>{await s.auth.signOut();check()};check();</script></body></html>
