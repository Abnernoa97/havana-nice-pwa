<script type="module">
  import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  const SUPABASE_URL="https://xzfradccsxonmauinecl.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_Ip5rGK0UVXIfOjs_RQ_LhA_c14foHN9";
  const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const experience=document.getElementById("experience"),backgroundVideo=document.getElementById("backgroundVideo"),loginScreen=document.getElementById("loginScreen"),homeScreen=document.getElementById("homeScreen"),moduleScreen=document.getElementById("moduleScreen"),usernameInput=document.getElementById("username"),loginButton=document.getElementById("loginButton"),loginMessage=document.getElementById("loginMessage"),welcomeName=document.getElementById("welcomeName"),welcomeRole=document.getElementById("welcomeRole"),logoutButton=document.getElementById("logoutButton"),moduleTitle=document.getElementById("moduleTitle"),backButton=document.getElementById("backButton"),soundButton=document.getElementById("soundButton"),soundIcon=document.getElementById("soundIcon"),soundLabel=document.getElementById("soundLabel"),colorButton=document.getElementById("colorButton"),colorLabel=document.getElementById("colorLabel");
  let soundEnabled=true,audioContext=null;
  function createAudioContext(){if(!audioContext){const A=window.AudioContext||window.webkitAudioContext;if(A)audioContext=new A()}return audioContext}
  function playClickSound(){const ctx=createAudioContext();if(!ctx)return;if(ctx.state==="suspended")ctx.resume();const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type="sine";oscillator.frequency.setValueAtTime(640,ctx.currentTime);oscillator.frequency.exponentialRampToValueAtTime(420,ctx.currentTime+.055);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.006);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.065);oscillator.connect(gain);gain.connect(ctx.destination);oscillator.start();oscillator.stop(ctx.currentTime+.07)}
  document.addEventListener("click",event=>{if(event.target.closest("button"))playClickSound()},true);
  document.addEventListener("keydown",event=>{if(!["Tab","Shift","Control","Alt","Meta"].includes(event.key))playClickSound()});
  backgroundVideo.muted=true;backgroundVideo.play().catch(()=>{});
  function showScreen(screen){loginScreen.classList.toggle("is-active",screen==="login");homeScreen.classList.toggle("is-active",screen==="home");moduleScreen.classList.toggle("is-active",screen==="module")}
  async function login(){const username=usernameInput.value.trim();loginMessage.textContent="";if(!username){loginMessage.textContent="Escribe tu nombre";return}loginButton.disabled=true;loginMessage.textContent="Verificando acceso...";try{const{data,error}=await supabase.rpc("login_by_username",{p_username:username});if(error)throw error;if(!data||!data.length){loginMessage.textContent="Acceso no autorizado";return}const profile=data[0];sessionStorage.setItem("hn_profile",JSON.stringify({id:profile.id,username:profile.username,role:profile.role}));enterHome(profile)}catch(error){console.error("HAVANA NICE login error:",error);loginMessage.textContent="No fue posible verificar el acceso"}finally{loginButton.disabled=false}}
  function enterHome(profile){welcomeName.textContent=profile.username||"Orly";welcomeRole.textContent=profile.role||"Percusión y Director Musical";loginMessage.textContent="";const ctx=createAudioContext();if(ctx&&ctx.state==="suspended")ctx.resume();if(soundEnabled){backgroundVideo.muted=false;backgroundVideo.play().catch(()=>{backgroundVideo.muted=true})}showScreen("home")}
  loginButton.addEventListener("click",login);usernameInput.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();login()}});
  function restoreSession(){const saved=sessionStorage.getItem("hn_profile");if(!saved){showScreen("login");return}try{const profile=JSON.parse(saved);if(profile&&profile.username){welcomeName.textContent=profile.username;welcomeRole.textContent=profile.role||"Músico de HAVANA NICE";showScreen("home");return}}catch(error){console.warn("Invalid saved profile",error)}sessionStorage.removeItem("hn_profile");showScreen("login")}
  async function logout(){sessionStorage.removeItem("hn_profile");try{await supabase.auth.signOut()}catch(_){}backgroundVideo.muted=true;showScreen("login");usernameInput.value="";loginMessage.textContent="";setTimeout(()=>usernameInput.focus(),500);window.dispatchEvent(new CustomEvent('hn:session-logout'))}
  logoutButton.addEventListener("click",logout);
  document.querySelectorAll(".module[data-module]").forEach(module=>module.addEventListener("click",()=>{moduleTitle.textContent=module.dataset.module||"PRÓXIMAMENTE";showScreen("module")}));
  backButton.addEventListener("click",()=>showScreen("home"));
  function updateSoundUI(){soundIcon.textContent=soundEnabled?"♪":"×";soundLabel.textContent=soundEnabled?"Sound On":"Sound Off"}
  soundButton.addEventListener("click",()=>{soundEnabled=!soundEnabled;backgroundVideo.muted=!soundEnabled;if(soundEnabled)backgroundVideo.play().catch(()=>{backgroundVideo.muted=true});updateSoundUI()});
  colorButton.addEventListener("click",()=>{const mono=experience.classList.toggle("is-monochrome");colorLabel.textContent=mono?"Color":"Black & White"});
  updateSoundUI();restoreSession();window.hnSupabase=supabase;window.playClickSound=playClickSound;
</script>
