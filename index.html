<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020403" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>HAVANA NICE — ORLY SHOW</title>

  <style>
    :root {
      --gold: #d6b45d;
      --gold-soft: #c8a95a;
      --paper: #f4f0e7;
      --muted: rgba(244,240,231,.68);
      --dark: #020403;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--dark);
      color: var(--paper);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: var(--dark);
    }

    /* =========================
       BACKGROUND VIDEO
       ========================= */

    .background-video {
      position: fixed;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(.82) contrast(1.08);
      transform: scale(1.01);
      transition:
        filter .9s ease,
        transform 1.2s ease;
    }

    .experience.is-monochrome .background-video {
      filter: grayscale(1) contrast(1.12) brightness(.86);
      transform: scale(1.015);
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(1,3,2,.68) 0%,
          rgba(1,3,2,.26) 36%,
          rgba(1,3,2,.46) 66%,
          rgba(1,3,2,.86) 100%
        );
    }

    .video-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          transparent 20%,
          rgba(0,0,0,.28) 75%,
          rgba(0,0,0,.62) 100%
        );
    }

    /* =========================
       SCREENS
       ========================= */

    .screen {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      padding:
        max(28px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(88px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.018);

      transition:
        opacity .65s ease,
        transform .65s cubic-bezier(.22,.61,.36,1),
        visibility 0s linear .65s;
    }

    .screen.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);

      transition:
        opacity .65s ease,
        transform .65s cubic-bezier(.22,.61,.36,1),
        visibility 0s;
    }

    .screen-inner {
      width: min(100%, 680px);
      margin: auto;
    }

    /* =========================
       BRAND
       ========================= */

    .brand {
      margin: 0;
      color: var(--gold);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .18em;
      text-indent: .18em;
      text-transform: uppercase;
    }

    .brand-line {
      width: 42px;
      height: 1px;
      margin: 18px auto 0;
      background: var(--gold);
      opacity: .9;
    }

    /* =========================
       LOGIN
       ========================= */

    .login-content {
      text-align: center;
    }

    .orly-name {
      margin: 36px 0 12px;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 15vw, 104px);
      font-weight: 400;
      line-height: .86;
      letter-spacing: -.045em;
      text-transform: uppercase;
      text-shadow: 0 2px 24px rgba(0,0,0,.38);
    }

    .orly-role {
      margin: 0;
      color: rgba(255,255,255,.82);
      font-size: clamp(11px, 2.8vw, 15px);
      font-weight: 400;
      letter-spacing: .22em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .login-area {
      width: min(100%, 390px);
      margin: 68px auto 0;
    }

    .private-title {
      margin-bottom: 18px;
      color: var(--paper);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .42em;
      text-align: center;
      text-indent: .42em;
      text-transform: uppercase;
    }

    .login-input {
      width: 100%;
      height: 56px;
      padding: 0 18px;

      border: 1px solid rgba(214,180,93,.62);
      border-radius: 0;

      outline: none;

      background: rgba(0,0,0,.38);
      color: var(--paper);

      font-size: 15px;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;

      backdrop-filter: blur(8px);

      transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .login-input::placeholder {
      color: rgba(244,240,231,.55);
    }

    .login-input:focus {
      border-color: var(--gold);
      background: rgba(0,0,0,.5);
      box-shadow: 0 0 0 1px rgba(214,180,93,.12);
    }

    .login-button {
      width: 100%;
      height: 56px;
      margin-top: 12px;

      border: 1px solid var(--gold);
      border-radius: 0;

      background:
        linear-gradient(
          180deg,
          rgba(214,180,93,.18),
          rgba(214,180,93,.07)
        );

      color: var(--gold);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .36em;
      text-indent: .36em;
      text-transform: uppercase;

      transition:
        background .25s ease,
        color .25s ease,
        transform .15s ease;
    }

    .login-button:hover {
      background: var(--gold);
      color: #080907;
    }

    .login-button:active {
      transform: scale(.985);
    }

    .login-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .login-message {
      min-height: 20px;
      margin-top: 14px;
      color: rgba(255,255,255,.72);
      font-size: 10px;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    /* =========================
       HOME
       ========================= */

    .home-inner {
      width: min(100%, 720px);
      margin: auto;
    }

    .home-top {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      right: max(24px, env(safe-area-inset-right));
      left: max(24px, env(safe-area-inset-left));

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .home-brand {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .logout-button {
      width: auto;
      min-width: 44px;
      height: 40px;

      padding: 0 13px;

      border: 1px solid rgba(214,180,93,.52);
      border-radius: 0;

      background: rgba(0,0,0,.26);
      color: var(--gold);

      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;

      backdrop-filter: blur(8px);

      transition:
        background .25s ease,
        color .25s ease;
    }

    .logout-button:hover {
      background: var(--gold);
      color: #080907;
    }

    .welcome {
      margin-bottom: 34px;
      text-align: center;
    }

    .welcome-small {
      margin-bottom: 10px;
      color: rgba(244,240,231,.72);
      font-size: 10px;
      letter-spacing: .45em;
      text-indent: .45em;
      text-transform: uppercase;
    }

    .welcome-name {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 14vw, 90px);
      font-weight: 400;
      line-height: .86;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .welcome-role {
      margin-top: 13px;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      letter-spacing: .22em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    /* =========================
       MODULES
       ========================= */

    .modules {
      display: grid;
      gap: 10px;
    }

    .module {
      position: relative;

      width: 100%;
      min-height: 78px;

      display: flex;
      align-items: center;
      gap: 18px;

      padding: 14px 18px;

      border: 1px solid rgba(214,180,93,.64);
      border-radius: 0;

      background:
        linear-gradient(
          110deg,
          rgba(0,0,0,.54),
          rgba(0,0,0,.22)

      color: var(--paper);

      text-align: left;

      backdrop-filter: blur(7px);

      transition:
        background .3s ease,
        border-color .3s ease,
        transform .2s ease;
    }

    .module:hover {
      border-color: var(--gold);
      background:
        linear-gradient(
          110deg,
          rgba(214,180,93,.13),
          rgba(0,0,0,.35)

    }

    .module:active {
      transform: scale(.985);
    }

    .module-number {
      width: 26px;
      flex: 0 0 26px;

      color: var(--gold);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .module-copy {
      flex: 1;
    }

    .module-title {
      display: block;
      color: var(--paper);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .module-subtitle {
      display: block;
      margin-top: 6px;
      color: rgba(244,240,231,.48);
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .module-arrow {
      color: var(--gold);
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
    }

    /* =========================
       CONTROLS
       ========================= */

    .controls {
      position: absolute;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      left: max(20px, env(safe-area-inset-left));

      z-index: 20;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      pointer-events: none;
    }

    .control-button {
      pointer-events: auto;

      display: flex;
      align-items: center;
      gap: 9px;

      width: auto;
      min-height: 38px;

      padding: 7px 0;

      border: 0;
      background: transparent;
      color: rgba(244,240,231,.88);

      font-size: 9px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;

      transition:
        color .25s ease,
        opacity .25s ease;
    }

    .control-button:hover {
      color: var(--gold);
    }

    .control-icon {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(214,180,93,.76);
      border-radius: 50%;

      color: var(--gold);
      font-size: 14px;

      background: rgba(0,0,0,.22);
      backdrop-filter: blur(7px);
    }

    .control-label {
      white-space: nowrap;
    }

    /* =========================
       MODULE PLACEHOLDER
       ========================= */

    .coming-screen {
      text-align: center;
    }

    .coming-title {
      margin: 0;
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 12vw, 78px);
      font-weight: 400;
      line-height: .9;
      letter-spacing: -.035em;
      text-transform: uppercase;
    }

    .coming-copy {
      margin-top: 18px;
      color: rgba(244,240,231,.68);
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .back-button {
      width: auto;
      min-height: 46px;
      margin: 34px auto 0;
      padding: 0 24px;

      border: 1px solid var(--gold);
      border-radius: 0;

      background: transparent;
      color: var(--gold);

      font-size: 9px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes revealUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen.is-active .login-content,
    .screen.is-active .home-inner,
    .screen.is-active .coming-screen {
      animation: revealUp .8s .08s both cubic-bezier(.22,.61,.36,1);
    }

    /* =========================
       SMALL SCREENS
       ========================= */

    @media (max-height: 700px) {
      .orly-name {
        margin-top: 24px;
        font-size: clamp(44px, 13vw, 72px);
      }

      .login-area {
        margin-top: 40px;
      }

      .welcome {
        margin-bottom: 22px;
      }

      .module {
        min-height: 65px;
      }

      .module-subtitle {
        display: none;
      }
    }

    @media (min-width: 768px) {
      .module {
        min-height: 92px;
      }

      .modules {
        gap: 12px;
      }
    }
  </style>
</head>

  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /* =========================
       SUPABASE
       ========================= */

    const SUPABASE_URL =
      "https://xzfradccsxonmauinecl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Ip5rGK0UVXIfOjs_RQ_LhA_c14foHN9";

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       ELEMENTS
       ========================= */

    const experience =
      document.getElementById("experience");

    const backgroundVideo =
      document.getElementById("backgroundVideo");

    const loginScreen =
      document.getElementById("loginScreen");

    const homeScreen =
      document.getElementById("homeScreen");

    const moduleScreen =
      document.getElementById("moduleScreen");

    const usernameInput =
      document.getElementById("username");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const welcomeName =
      document.getElementById("welcomeName");

    const welcomeRole =
      document.getElementById("welcomeRole");

    const logoutButton =
      document.getElementById("logoutButton");

    const moduleTitle =
      document.getElementById("moduleTitle");

    const backButton =
      document.getElementById("backButton");

    const soundButton =
      document.getElementById("soundButton");

    const soundIcon =
      document.getElementById("soundIcon");

    const soundLabel =
      document.getElementById("soundLabel");

    const colorButton =
      document.getElementById("colorButton");

    const colorLabel =
      document.getElementById("colorLabel");


    /* =========================
       STATE
       ========================= */

    let soundEnabled = true;

    let audioContext = null;

    let currentScreen = "login";


    /* =========================
       SMALL UI SOUND
       ========================= */

    function createAudioContext() {

      if (!audioContext) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (AudioContext) {
          audioContext = new AudioContext();
        }
      }

      return audioContext;
    }


    function playClickSound() {

      if (!soundEnabled) {
        return;
      }

      const ctx =
        createAudioContext();

      if (!ctx) {
        return;
      }

      if (ctx.state === "suspended") {
        ctx.resume();
      }

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      oscillator.type = "sine";

      oscillator.frequency.setValueAtTime(
        640,
        ctx.currentTime
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        420,
        ctx.currentTime + 0.055
      );

      gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.045,
        ctx.currentTime + 0.006
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + 0.065
      );

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.start();

      oscillator.stop(
        ctx.currentTime + 0.07
      );
    }


    /* =========================
       CLICK SOUND ON EVERY BUTTON
       ========================= */

    document.addEventListener(
      "click",
      (event) => {

        const interactive =
          event.target.closest(
            "button"
          );

        if (interactive) {
          playClickSound();
        }

      },
      true
    );


    /* =========================
       KEYBOARD SOUND
       ========================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Tab" ||
          event.key === "Shift" ||
          event.key === "Control" ||
          event.key === "Alt" ||
          event.key === "Meta"
        ) {
          return;
        }

        playClickSound();

      }
    );


    /* =========================
       VIDEO
       ========================= */

    backgroundVideo.muted = true;

    backgroundVideo.play()
      .catch(() => {});


    /* =========================
       SCREEN CONTROL
       ========================= */

    function showScreen(screen) {

      currentScreen = screen;

      loginScreen.classList.toggle(
        "is-active",
        screen === "login"
      );

      homeScreen.classList.toggle(
        "is-active",
        screen === "home"
      );

      moduleScreen.classList.toggle(
        "is-active",
        screen === "module"
      );

    }


    /* =========================
       PROFILE
       ========================= */

    function normalizeUsername(value) {

      return String(value || "")
        .trim()
        .toLowerCase();

    }


    function showProfilePreview() {

      const value =
        normalizeUsername(
          usernameInput.value
        );

      if (value === "orly") {

        document.querySelector(
          ".orly-name"
        ).textContent =
          "ORLY SHOW";

      }

    }


    usernameInput.addEventListener(
      "input",
      showProfilePreview
    );


    /* =========================
       LOGIN
       ========================= */

    async function login() {

      const username =
        usernameInput.value.trim();

      loginMessage.textContent = "";

      if (!username) {

        loginMessage.textContent =
          "Escribe tu nombre";

        return;
      }

      loginButton.disabled = true;

      loginMessage.textContent =
        "Verificando acceso...";


      try {

        const {
          data,
          error
        } =
          await supabase.rpc(
            "login_by_username",
            {
              p_username: username
            }
          );


        if (error) {
          throw error;
        }


        if (!data || !data.length) {

          loginMessage.textContent =
            "Acceso no autorizado";

          loginButton.disabled = false;

          return;
        }


        const profile =
          data[0];


        sessionStorage.setItem(
          "hn_profile",
          JSON.stringify({
            id: profile.id,
            username: profile.username,
            role: profile.role
          })
        );


        enterHome(profile);


      } catch (error) {

        console.error(
          "HAVANA NICE login error:",
          error
        );

        loginMessage.textContent =
          "No fue posible verificar el acceso";

      } finally {

        loginButton.disabled = false;

      }

    }


    /* =========================
       ENTER HOME
       ========================= */

    function enterHome(profile) {

      const username =
        profile.username || "Orly";

      const role =
        profile.role ||
        "Percusión y Director Musical";


      welcomeName.textContent =
        username;

      welcomeRole.textContent =
        role;


      loginMessage.textContent = "";


      /* Activar audio después
         del gesto del usuario */

      const ctx =
        createAudioContext();

      if (
        ctx &&
        ctx.state === "suspended"
      ) {
        ctx.resume();
      }


      /* El video sigue reproduciéndose
         pero podemos intentar activar
         sonido después del gesto */

      if (soundEnabled) {

        backgroundVideo.muted = false;

        backgroundVideo.play()
          .catch(() => {

            backgroundVideo.muted = true;

          });

      }


      showScreen("home");

    }


    loginButton.addEventListener(
      "click",
      login
    );


    usernameInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          login();

        }

      }
    );


    /* =========================
       RESTORE SESSION
       ========================= */

    function restoreSession() {

      const saved =
        sessionStorage.getItem(
          "hn_profile"
        );

      if (!saved) {

        showScreen("login");

        return;

      }


      try {

        const profile =
          JSON.parse(saved);

        if (
          profile &&
          profile.username
        ) {

          welcomeName.textContent =
            profile.username;

          welcomeRole.textContent =
            profile.role ||
            "Músico de HAVANA NICE";

          showScreen("home");

          return;
        }

      } catch (error) {

        console.warn(
          "Invalid saved profile",
          error
        );

      }


      sessionStorage.removeItem(
        "hn_profile"
      );

      showScreen("login");

    }


    /* =========================
       LOGOUT
       ========================= */

    async function logout() {

      sessionStorage.removeItem(
        "hn_profile"
      );

      try {
        await supabase.auth.signOut();
      } catch (_) {}

      backgroundVideo.muted = true;

      showScreen("login");

      usernameInput.value = "";

      loginMessage.textContent = "";

      setTimeout(() => {

        usernameInput.focus();

      }, 500);

    }


    logoutButton.addEventListener(
      "click",
      logout
    );


    /* =========================
       MODULES
       ========================= */

    document
      .querySelectorAll(".module")
      .forEach((module) => {

        module.addEventListener(
          "click",
          () => {

            const name =
              module.dataset.module ||
              "PRÓXIMAMENTE";

            moduleTitle.textContent =
              name;

            showScreen("module");

          }
        );

      });


    backButton.addEventListener(
      "click",
      () => {

        showScreen("home");

      }
    );


    /* =========================
       SOUND ON / OFF
       ========================= */

    function updateSoundUI() {

      if (soundEnabled) {

        soundIcon.textContent = "♪";

        soundLabel.textContent =
          "Sound On";

      } else {

        soundIcon.textContent = "×";

        soundLabel.textContent =
          "Sound Off";

      }

    }


    soundButton.addEventListener(
      "click",
      () => {

        soundEnabled =
          !soundEnabled;


        if (!soundEnabled) {

          backgroundVideo.muted = true;

        } else {

          backgroundVideo.muted = false;

          const ctx =
            createAudioContext();

          if (
            ctx &&
            ctx.state === "suspended"
          ) {
            ctx.resume();
          }

          backgroundVideo.play()
            .catch(() => {

              backgroundVideo.muted = true;

            });

        }


        updateSoundUI();

      }
    );


    /* =========================
       COLOR / B&W
       ========================= */

    colorButton.addEventListener(
      "click",
      () => {

        const monochrome =
          experience.classList.toggle(
            "is-monochrome"
          );


        colorLabel.textContent =
          monochrome
            ? "Color"
            : "Black & White";

      }
    );


    /* =========================
       START
       ========================= */

    updateSoundUI();

    restoreSession();

  </script>

</body>
</html>
