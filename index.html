<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020302" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>HAVANA NICE</title>

  <style>
    :root {
      --gold-light: #fff1a8;
      --gold: #e5bd62;
      --gold-dark: #8c6424;
      --gold-shadow: rgba(229, 189, 98, .25);
      --white: #f4f1e8;
      --muted: rgba(244,241,232,.68);
      --black: #020302;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =====================================================
       APP
       ===================================================== */

    .experience {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #020302;
    }

    /* =====================================================
       VIDEO
       ===================================================== */

    .background-video {
      position: fixed;
      inset: 0;
      z-index: -3;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      filter:
        saturate(.78)
        contrast(1.08)
        brightness(.72);

      transform: scale(1.015);

      transition:
        filter 1s ease,
        transform 1.2s ease;
    }
